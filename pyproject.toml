[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Mulligan", email = "david@hppn.co.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.6",
    "langsmith>=0.14.17",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
